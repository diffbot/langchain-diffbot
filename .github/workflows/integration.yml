name: Integration

# Hits the live Diffbot APIs, so it consumes real quota and needs a token.
# Runs on push to main (trusted collaborators only), on a twice-monthly
# drift check (1st and 15th at 14:17 UTC), and on-demand via workflow_dispatch.
# Do NOT add a `pull_request` trigger — fork PRs should not run live tests,
# and untrusted workflow code must never receive DIFFBOT_API_TOKEN.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_SYNC: "true"

jobs:
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --no-sources --group test
      - run: make test_integration
        env:
          DIFFBOT_API_TOKEN: ${{ secrets.DIFFBOT_API_TOKEN }}
